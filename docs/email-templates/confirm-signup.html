<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your email for Bonded</title>
</head>
<body style="margin:0;padding:0;background:#eef6fb;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef6fb">
  <tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px">
      <tr><td align="center" style="padding:0 0 20px">
        <a href="https://www.bonded.dog" style="text-decoration:none"><img src="https://www.bonded.dog/images/logo.png" width="150" height="60" alt="Bonded" style="display:block;border:0"></a>
      </td></tr>
      <tr><td style="background:#ffffff;border:1px solid #e3ecf1;border-radius:16px;padding:32px 28px">
<div style="text-align:center;margin:0 0 14px"><img src="https://www.bonded.dog/sketches/intro.jpg" width="120" height="120" alt="" style="display:inline-block;border:0;max-width:100%"></div>
<p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#243036">Hi,</p>
<p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#243036">Welcome to Bonded! Confirm your email address to finish creating your account.</p>
<div style="margin:22px 0">
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/home" style="display:inline-block;background:#0e666a;color:#ffffff;font-weight:600;font-size:15px;text-decoration:none;padding:12px 24px;border-radius:999px">Confirm my email</a>
</div>
<p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#243036">If you did not sign up, you can ignore this email.</p>
      </td></tr>
      <tr><td align="center" style="padding:20px 8px 0;font-size:12px;line-height:1.5;color:#85939a">
        Bonded · Learn your dog's secret language<br>
        <a href="https://www.bonded.dog" style="color:#85939a">www.bonded.dog</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
